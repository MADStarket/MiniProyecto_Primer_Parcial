<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/gift.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="/src/styles/index.css">
  <script type="module" src="/src/index.ts"></script>
  <title>Miniproyecto #1</title>
</head>

<body>
  <div class="bg-blur absolute"></div>
  <main class="main relative flex flex-col">
    <!--Manejo de "Componentes"-->
    <header-component class="header"></header-component>

    <!--div principal-->
    <div class="principal flex-grow flex items-center justify-center">
      <div class="flex flex-col items-center justify-center gap-4 max-w-3xl">

        <div class="relative bg-white shadow-[0_50px_100px_rgba(39,136,229,0.2)] rounded-full p-16">
          <!--SVG primario-->
          <svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 24 24" fill="none"
            stroke="#1E88E5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-gift-icon lucide-gift">
            <path d="M12 7v14" />
            <path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" />
            <path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5" />
            <rect x="3" y="7" width="18" height="4" rx="1" />
          </svg>

          <!--SVG secundario -->
          <svg class="absolute top-4 right-4 animate-bounce" xmlns="http://www.w3.org/2000/svg" width="50" height="50"
            viewBox="0 0 24 24" fill="#fde047" stroke="#facc15" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" class="lucide lucide-star-icon lucide-star">
            <path
              d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" />
          </svg>
        </div>

        <p class="text-6xl font-black text-center">Organiza tu <span
            class="bg-gradient-to-r from-blue-600 to-pink-500 bg-clip-text text-transparent">Intercambio de
            Regalos</span></p>

        <p class="text-2xl text-slate-700 text-center font-md">La forma mas facil y divertida de sortear nombres. Agrega
          participantes,
          configura reglas y
          nosotros haremos
          la magia (respetando tus exclusiones).</p>

        <button type="button" onclick="window.location.href='src/pages/organizador.html'"
          class="flex items-center text-3xl text-white p-2 rounded-2xl font-black gap-2 bg-blue-600">Comenzar el sorteo
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-move-right-icon lucide-move-right">
            <path d="M18 8L22 12L18 16" />
            <path d="M2 12H22" />
          </svg>
        </button>
      </div>
    </div>

    <footer-component class="footer"></footer-component>
  </main>
</body>

</html>
