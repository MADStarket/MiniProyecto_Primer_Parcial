<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/gift.svg" />
  <link rel="stylesheet" href="/src/styles/styles.css">
  <link rel="stylesheet" href="/src/styles/celebracion.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tipo de Celebracion</title>

  <script type="module" src="/src/ts/celebracion.ts"></script>
</head>

<body>
  <div class="bg-blur absolute"></div>
  <main class="main relative flex flex-col">
    <header-component class="header"></header-component>
    <!--div principal ahora si con grid-->
    <div class="principal grid place-items-center w-full h-full">

      <div class="recuadro bg-white rounded-2xl p-4 shadow-lg w-[90%] md:w-[70%] lg:w-[60%] xl:w-[40%]">
        <div class="flex flex-col gap-2  justify-center items-center pb-3 text-center">
          <p class="text-lg md:text-2xl font-black">Detalles de la Celebración</p>
        </div>

        <div class="flex flex-col gap-2 pb-3 ">
          <p class="text-base md:text-xl font-medium text-slate-700">¿Qué celebran?</p>

          <div class="flex flex-col gap-3">
            <button type="button"
              class="celebracionBtn flex-1 p-3 rounded-lg border-2 border-slate-300 text-slate-700 font-semibold hover:border-blue-500 transition"
              data-value="Navidad">
              Navidad
            </button>

            <button type="button"
              class="celebracionBtn flex-1 p-3 rounded-lg border-2 border-slate-300 text-slate-700 font-semibold hover:border-blue-500 transition"
              data-value="San Valentin">
              San Valentin
            </button>

            <button type="button"
              class="celebracionBtn flex-1 p-3 rounded-lg border-2 border-slate-300 text-slate-700 font-semibold hover:border-blue-500 transition"
              data-value="Otro">
              Otro
            </button>
          </div>

          <input type="text" id="tipodeCelebracion"
            class="w-full p-2 rounded-lg border border-slate-300 disabled:opacity-50 disabled:bg-slate-100 disabled:cursor-not-allowed placeholder:text-sm"
            placeholder="O escribe el nombre (Ej. Intercambio Oficina)" autocomplete="off" disabled>
        </div>

        <div class="flex flex-col gap-2 pb-3 ">
          <p class="text-base md:text-xl font-medium text-slate-700">Fecha de Celebracion</p>

          <input type="date" id="fechaCelebracion" class="w-full p-2 rounded-lg border border-slate-300">
        </div>


        <div class="grid grid-cols-16 gap-2 mt-3">
          <button type="button" id="botonRegresar"
            class="col-span-3 md:col-span-2 flex items-center justify-center text-xl text-white p-2 rounded-2xl font-black bg-[#334155] cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-chevron-left-icon lucide-chevron-left">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>

          <button type="button" id="botonPasaraPresupuesto"
            class="col-span-13 md:col-span-14 gap-3 flex items-center justify-center text-white p-2 rounded-2xl font-black bg-blue-600 cursor-pointer">Continuar
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-move-right-icon lucide-move-right">
              <path d="M18 8L22 12L18 16" />
              <path d="M2 12H22" />
            </svg>
          </button>
        </div>
      </div>

    </div>

    <footer-component class="footer"></footer-component>
  </main>

</body>

</html>
