<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/gift.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miniproyecto #1</title>

  <link rel="stylesheet" href="/src/styles/styles.css">
  <link rel="stylesheet" href="/src/styles/cuanto-gastar.css">

  <script type="module" src="/src/ts/cuanto-gastar.ts"></script>
</head>

<body>
  <div class="bg-blur absolute"></div>
  <main class="main relative flex flex-col">
    <!--Manejo de componentes-->
    <header-component class="header"></header-component>

    <!--div principal-->
    <div class="grid place-items-center w-full h-full">

      <div class="recuadro bg-white rounded-2xl p-4 shadow-lg w-[80%] md:w-[60%] lg:w-[50%] xl:w-[30%]">
        <div>
          <p class="flex font-black text-lg md:text-2xl justify-center items-center pb-2">¿Cuanto deberian gastar?<p/>

            <!--div para los 5 presupuestos recomendados-->
          <div class="grid grid-cols-5 gap-1 md:gap-2">

            <button type="button" id="presupuesto-100"
              class="col-span-1 flex items-center justify-center px-2 py-1 text-md md:text-xl hover:border-blue-600 text-black rounded-xl border border-[#334155] font-black cursor-pointer">$100</button>

            <button type="button" id="presupuesto-200"
              class="col-span-1 flex items-center justify-center px-2 py-1 text-md md:text-xl hover:border-blue-600 text-black rounded-xl border border-[#334155] font-black cursor-pointer">$200</button>

            <button type="button" id="presupuesto-300"
              class="col-span-1 flex items-center justify-center px-2 py-1 text-md md:text-xl hover:border-blue-600 text-black rounded-xl border border-[#334155] font-black cursor-pointer">$300</button>

            <button type="button" id="presupuesto-400"
              class="col-span-1 flex items-center justify-center px-2 py-1 text-md md:text-xl hover:border-blue-600 text-black rounded-xl border border-[#334155] font-black cursor-pointer">$400</button>

            <button type="button" id="presupuesto-500"
              class="col-span-1 flex items-center justify-center px-2 py-1 text-md md:text-xl hover:border-blue-600 text-black rounded-xl border border-[#334155] font-black cursor-pointer">$500</button>
          </div>
        </div>

        <div class="pt-1">
          <label class="text-sm md:text-lg font-medium text-slate-700" for="presupuesto">O escribe otro presupuesto</label>
          <div class="flex relative">
            <input type="text" id="presupuesto" class="w-full p-2 rounded-lg" placeholder="Ej. $150" autocomplete="off">
          </div>
        </div>

        <div class="grid grid-cols-16 gap-2 mt-3">
          <button type="button" id="botonRegresar"
            class="col-span-3 md:col-span-2 flex items-center justify-center text-xl text-white p-2 rounded-2xl font-black bg-[#334155] cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-chevron-left-icon lucide-chevron-left">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>

          <button type="button" id="botonPasarResumen"
            class="col-span-13 md:col-span-14 gap-3 flex items-center justify-center text-white p-2 rounded-2xl font-black bg-blue-600 cursor-pointer">Continuar
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-move-right-icon lucide-move-right">
              <path d="M18 8L22 12L18 16" />
              <path d="M2 12H22" />
            </svg>
          </button>
        </div>

      </div>
    </div>


    <footer-component class="footer"></footer-component>
  </main>


</body>

</html>
