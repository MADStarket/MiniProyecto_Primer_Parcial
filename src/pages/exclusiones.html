<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/gift.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miniproyecto #1</title>

  <link rel="stylesheet" href="/src/styles/styles.css">
  <link rel="stylesheet" href="/src/styles/exclusiones.css">

  <script type="module" src="/src/ts/exclusiones.ts"> </script>
</head>

<body>
  <div class="bg-blur absolute"></div>
  <main class="main relative flex flex-col">
    <header-component class="header"></header-component>
    <!--div principal ahora si con grid-->
    <div class="principal grid place-items-center w-full h-full">

      <div class="recuadro bg-white rounded-2xl p-4 shadow-lg w-[90%] md:w-[70%] lg:w-[60%] xl:w-[40%]">
        <progress id="progress" class="w-full"></progress>

        <!-- Vista inicial: Pregunta si quiere exclusiones -->
        <div id="preguntaInicial" class="flex flex-col gap-4 justify-center items-center py-8">
          <div class="flex flex-col gap-2 text-center">
            <p class="text-lg md:text-2xl font-black">¿Desea configurar exclusiones?</p>
            <p class="text-sm md:text-lg font-medium text-slate-700">Las exclusiones permiten indicar quién no puede regalarle a quién</p>
          </div>

          <div class="flex flex-col md:flex-row gap-3 w-full mt-4">
            <button type="button" id="botonSiExclusiones"
              class="flex-1 gap-2 flex items-center justify-center text-white p-3 rounded-2xl font-black bg-blue-600 cursor-pointer hover:bg-blue-700 transition-colors">
              Sí, configurar exclusiones
            </button>

            <button type="button" id="botonNoExclusiones"
              class="flex-1 gap-2 flex items-center justify-center text-white p-3 rounded-2xl font-black bg-green-600 cursor-pointer hover:bg-green-700 transition-colors">
              No, continuar sin exclusiones
            </button>
          </div>

          <button type="button" id="botonRegresarInicial"
            class="mt-4 flex items-center gap-2 text-slate-600 font-medium hover:text-slate-800 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6" />
            </svg>
            Regresar
          </button>
        </div>

        <!-- Vista de configuración de exclusiones (oculta inicialmente) -->
        <div id="configuracionExclusiones" class="hidden">
          <div class="flex flex-col gap-2  justify-center items-center pb-3 text-center">
            <p class="text-lg md:text-2xl font-black">Configuracion de Exclusiones</p>

            <p class="text-sm md:text-xl font-medium text-slate-700">Arrastra los nombres a la caja roja para
              indicar quién no puede regalarle a quién</p>
          </div>

          <div class="flex flex-col gap-2 justify-center items-center pb-3 text-center">

              <select id="SelectorParticipantes"
              class="w-full h-10 px-4 text-xs md:text-sm border border-slate-200 rounded focus:border-blue-600">
              <option value="">-- Selecciona un participante --</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="flex flex-col">
              <p class="text-md md:text-xl font-black mb-1 text-slate-700 text-center">DISPONIBLES</p>
              <div id="disponibles" class="drop-zone min-h-[300px] border-2 border-gray-400 bg-gray-50 rounded-lg p-4">
                <!-- Se llenará dinamicamente -->
              </div>
            </div>

            <div class="flex flex-col">
              <p class="text-md md:text-xl font-black mb-1 text-slate-700 text-center">EXCLUIDOS</p>
              <div id="excluidos" class="drop-zone min-h-[300px] border-2 border-red-400 bg-red-50 rounded-lg p-4">
                <!-- Se llenará dinamicamente -->
              </div>
            </div>
          </div>

          <div class="grid grid-cols-16 gap-2 mt-3">
            <button type="button" id="botonRegresar"
              class="col-span-3 md:col-span-2 flex items-center justify-center text-xl text-white p-2 rounded-2xl font-black bg-[#334155] cursor-pointer">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-chevron-left-icon lucide-lucide-chevron-left">
                <path d="m15 18-6-6 6-6" />
              </svg>
            </button>

            <button type="button" id="botonPasarExclusiones"
              class="col-span-13 md:col-span-14 gap-3 flex items-center justify-center text-white p-2 rounded-2xl font-black bg-blue-600 cursor-pointer">Continuar
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-move-right-icon lucide-move-right">
                <path d="M18 8L22 12L18 16" />
                <path d="M2 12H22" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer-component class="footer"></footer-component>
  </main>
</body>

</html>
