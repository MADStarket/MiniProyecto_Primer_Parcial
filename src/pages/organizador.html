<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/gift.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miniproyecto #1</title>

  <link rel="stylesheet" href="/src/styles/styles.css">
  <link rel="stylesheet" href="/src/styles/organizador.css">

  <script type="module" src="/src/ts/organizador.ts"></script>
</head>

<body>
  <div class="bg-blur absolute"></div>
  <main class="main relative flex flex-col">
    <!--Manejo de "Componentes"-->
    <header-component class="header"></header-component>

    <!--div principal ahora si con grid-->
    <div class="grid place-items-center w-full h-full">

      <div class="recuadro bg-white rounded-2xl p-4 shadow-lg w-[80%] md:w-[60%] lg:w-[50%] xl:w-[30%]">

        <div class="flex flex-col justify-center items-center pb-3 text-center">
          <img src="/gift-box.png" alt="Regalo">
          <p class="text-2xl font-black">¿Quién organiza el intercambio?</p>
        </div>

        <form class="grid gap-3 w-full">
          <div>
            <label class="text-sm font-medium text-slate-700" for="nombreOrganizador">¿Cuál es tu nombre?</label>
            <input type="text" id="nombreOrganizador" class="w-full p-2 rounded-lg" placeholder="Ej. Irving"
              autocomplete="off">
          </div>

          <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200">
            <input type="checkbox" id="incluirOrganizador" checked class="w-5 h-5 text-blue-600 rounded">
            <label for="incluirOrganizador" class="text-xs cursor-pointer select-none md:text-sm">Incluyeme (el
              organizador) en el sorteo</label>
          </div>
        </form>

        <div class="grid place-items-center mt-3">
          <button type="button" id="botonPasarOrganizador"
            class="flex items-center text-md text-white p-2 rounded-2xl font-black gap-2 bg-blue-600 cursor-pointer md:xl">Continuar
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-move-right-icon lucide-move-right">
              <path d="M18 8L22 12L18 16" />
              <path d="M2 12H22" />
            </svg>
          </button>
        </div>

      </div>
    </div>

    <footer-component class="footer"></footer-component>
  </main>

</body>

</html>
