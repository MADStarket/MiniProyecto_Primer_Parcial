<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/gift.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miniproyecto #1</title>

  <link rel="stylesheet" href="/src/styles/styles.css">
  <link rel="stylesheet" href="/src/styles/resultados.css">

  <script type="module" src="/src/ts/resultados.ts"></script>
</head>
<body>
<div class="bg-blur absolute"></div>
  <main class="main relative flex flex-col">
    <header-component class="header"></header-component>
    <div class="grid place-items-center w-full h-full">
      <div class="recuadro bg-white rounded-2xl p-4 shadow-lg w-[90%] md:w-[70%] lg:w-[60%] xl:w-[40%]">
        <div class="flex flex-col gap-2 justify-center items-center pb-3 text-center">
            <p class="text-lg md:text-2xl font-black">Resultados del Sorteo</p>
            <p class="text-sm md:text-base font-medium text-slate-700">(Las exclusiones han sido respetadas)</p>
        </div>

        <div id="contenedorResultados" class="grid gap-3 max-h-[400px] overflow-y-auto pr-3">
          <!-- Se llena de manera dinamica -->
        </div>

        <div class="grid place-items-center mt-3">
          <button type="button" id="botonPasarInicio"
            class="flex items-center text-lg text-white p-2 rounded-2xl font-black gap-2 bg-[#1e293b] cursor-pointer md:text-xl">Hacer otro Intercambio
          </button>
        </div>
      </div>
    </div>
    <footer-component class="footer"></footer-component>
  </main>
</body>
</html>
