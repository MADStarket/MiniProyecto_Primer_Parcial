<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/gift.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miniproyecto #1</title>

  <link rel="stylesheet" href="/src/styles/styles.css">
  <link rel="stylesheet" href="/src/styles/resumen.css">

  <script type="module" src="/src/ts/resumen.ts"></script>
</head>

<body>
  <div class="bg-blur absolute"></div>
  <main class="main relative flex flex-col">
    <!--Manejo de "Componentes"-->
    <header-component class="header"></header-component>

    <div class="principal grid place-items-center w-full h-full">
      <div class="recuadro bg-white rounded-2xl p-4 shadow-lg w-[80%] md:w-[60%] lg:w-[50%] xl:w-[30%]">

        <div class="text-center pt-1 pb-4">
          <p class="font-black text-2xl md:text-4xl text-green-500">¡Todo listo!</p>
          <p class="text-sm md:text-md text-slate-700">Datos cargados desde LocalStorage</p>
        </div>

        <div class="p-2 border border-[#E0E0E0] rounded-lg bg-gray-100">
          <p id="nombreCelebracion" class="font-black text-lg md:text-2xl"><span id="nombreCelebracion"></span></p>
          <hr>
          <p class="font-black text-sm md:text-lg">Organizador: <span id="nombreOrganizador" class="font-normal"></span>
          </p>
          <p class="font-black text-sm md:text-lg">Fecha: <span id="fechaCelebracion" class="font-normal"></span></p>
          <p class="font-black text-sm md:text-lg">Presupuesto: <span id="presupuesto" class="font-normal"></span></p>
          <p class="font-black text-sm md:text-lg" id="participantes"></p>
        </div>

        <div class="grid grid-rows-2 gap-2 mt-3">
          <button type="button" id="botonRegresar"
            class="flex items-center justify-center gap-2 text-md md:text-xl text-white p-2 rounded-2xl font-black bg-blue-600 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-gift-icon lucide-gift">
              <path d="M12 7v14" />
              <path d="M20 11v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8" />
              <path d="M7.5 7a1 1 0 0 1 0-5A4.8 8 0 0 1 12 7a4.8 8 0 0 1 4.5-5 1 1 0 0 1 0 5" />
              <rect x="3" y="7" width="18" height="4" rx="1" />
            </svg>
            ¡Realizar Sorteo Magico!
          </button>

          <a class="text-center text-sm md:text-lg text-slate-700 underline" href="/index.html">Empezar de nuevo</a>

        </div>
      </div>
    </div>

    <footer-component class="footer"></footer-component>
  </main>
</body>

</html>
